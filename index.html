const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const pick=(r,keys)=>{for(const k of Object.keys(r)){const n=norm(k);if(keys.some(x=>n.includes(x)))return r[k]}return ''};
const num=v=>{const n=parseFloat(String(v).replace('%','').replace(',','.'));return isNaN(n)?0:n};
function read(file,kind){
 const fr=new FileReader();
 fr.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  let hi=aoa.findIndex(r=>r.filter(c=>/cedula|nombre|fecha|producto|punto|valor|ciudad|responsable|cargo|clave/.test(norm(c))).length>=2);if(hi<0)hi=0;
  const hd=(aoa[hi]||[]).map(c=>String(c).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};hd.forEach((k,i)=>{if(k)o[k]=r[i]??''});return o});
  {const body=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')),fi=hd.findIndex(c=>norm(c)=='fecha');S.tpl=S.tpl||{};S.tpl[kind]={hd,rows:body.map(r=>hd.map((_,i)=>i==fi?toISO(r[i]):(r[i]??'')))}}
  if(kind=='v')S.puntos=rows.map(r=>({name:String(pick(r,['punto','nombre','sucursal','oficina'])).trim(),ciudad:pick(r,['ciudad','municipio','direccion']),resp:pick(r,['responsable','coordinador','encargado','lider'])})).filter(x=>x.name);else if(kind=='p')S.personal=rows.map(r=>({id:String(pick(r,['cedula','documento','id'])).trim(),nombre:String(pick(r,['nombre','asesor','empleado'])).trim(),cargo:pick(r,['cargo']),clave:String(pick(r,['clave','pin'])).trim(),punto:String(pick(r,['punto','sucursal','oficina'])).trim()||'Sin punto'}));
  else if(kind=='t')S.tarea=mergeRows(S.tarea,parseC(rows,PRODT),kT);else if(kind=='h')S.hoy=mergeRows(S.hoy,rows.map(r=>({id:String(pick(r,['cedula','documento','id'])).trim(),nombre:String(pick(r,['nombre','asesor','empleado'])).trim(),fecha:toISO(pick(r,['fecha','dia'])),prod:String(pick(r,['producto','indicador'])).trim(),valor:num(pick(r,['valor','cantidad','meta'])),ta:nv(pick(r,['tarea de ayer','tarea ayer'])),ra:nv(pick(r,['real de ayer','real ayer']))})).filter(x=>x.prod&&x.fecha),kH);else S.cumpl=mergeRows(S.cumpl,parseC(rows),kC);
  S.msg=(kind=='v'?'Puntos':kind=='p'?'Personal':kind=='t'?'Tarea diaria':kind=='h'?'Tarea de hoy':'Cumplimientos')+' cargado: '+rows.length+' filas'+warn(kind,rows)+(kind=='p'||kind=='v'?'':' · se suma al historial. Toca Publicar accesos para guardarlo');save();render();
 }catch(err){S.msg='No pude leer el archivo ('+((err&&err.message)||err)+'). Usa Excel (.xlsx) o CSV.';render()}};
 fr.readAsArrayBuffer(file);
}
function build(){
 const byId={},byName={};S.personal.forEach(p=>{if(p.id)byId[p.id]=p;byName[norm(p.nombre)]=p});
 const pts={};S.puntos.forEach(v=>{pts[v.name]={name:v.name,ciudad:v.ciudad,resp:v.resp,ases:{},items:[]}});const pk=n=>Object.keys(pts).find(k=>norm(k)==norm(n))||n;
 S.cumpl.forEach(c=>{const k=pk(c.punto||'Sin asignar');const P=pts[k]??={name:k,ases:{},items:[]};
  P.m??={};const key=c.ind+'|'+c.periodo;let it=P.m[key];
  if(!it){it={ind:c.ind,periodo:c.periodo,meta:0,res:0,pc:0};P.m[key]=it;P.items.push(it)}
  it.meta+=c.meta;it.res+=c.res;it.pc=it.meta?it.res/it.meta*100:0;
  if(c.fecha)(P.days??=[]).push({f:c.fecha,i:c.ind,m:c.meta,r:c.res})});
 S.tarea.forEach(c=>{const p=byId[c.id]||byName[norm(c.nombre)];if(!p)return;const k=pk(p.punto);const P=pts[k]??={name:k,ases:{},items:[]};
  const A=P.ases[p.nombre]??={id:p.id,nombre:p.nombre,cargo:p.cargo,items:[]};
  A.m??={};const key=c.ind+'|'+c.periodo;let it=A.m[key];
  if(!it){it={ind:c.ind,periodo:c.periodo,meta:0,res:0,pc:0};A.m[key]=it;A.items.push(it)}
  it.meta+=c.meta;it.res+=c.res;it.pc=it.meta?it.res/it.meta*100:0;
  if(c.fecha)(A.days??=[]).push({f:c.fecha,i:c.ind,m:c.meta,r:c.res})});
 S.personal.forEach(p=>{const P=pts[pk(p.punto)]??={name:pk(p.punto),ases:{},items:[]};P.ases[p.nombre]??={id:p.id,nombre:p.nombre,cargo:p.cargo,items:[]}});
 return pts;
}
const avg=a=>a.length?a.reduce((s,i)=>s+i.pc,0)/a.length:0;
const cls=p=>p>=100?'ok':p>=95?'md':'bad';
const pill=(p,n)=>`<span class="pill ${n?cls(p):'md'}">${n?p.toFixed(0)+'%':'—'}</span>`;
const bar=p=>`<div class="bar"><i class="${cls(p)}" style="width:${Math.min(p,100)}%"></i></div>`;
function render(){hdr();
 if(S.mode===null){document.getElementById('app').innerHTML='<p class="mu">Cargando…</p>';return}
 if(S.mode=='asesor'||location.hash=='#asesor')return renderAs();
 const pts=build(),A=document.getElementById('app');
 let h=`<div class="card"><b>1. Sube tus archivos</b><p class="mu">Excel o CSV. Puntos: nombre del punto, ciudad, responsable. Personal: cédula, nombre, cargo, punto. Cumplimiento punto: punto, fecha (una fila por punto por día) y, por cada producto (Chance, Lotería virtual, Lotería física, Baloto, Astro millonario, Kash, Raspa y gana, Recargas, Betplay), su Meta y su Real. TAREA DIARIA: igual, con los productos CH millonario y CH millonario 1 a 5, Tripletazo, Baloto, Miloto, Lotería virtual, Kash, Superchance y Raspa y listo. TU TAREA DE HOY: cédula, nombre, fecha, producto, valor a realizar, tarea de ayer y real de ayer (si dejas cédula y nombre vacíos, aplica a todos los asesores).</p>
 <div class="row"><label class="b">📍 Puntos de venta<input type="file" accept=".xlsx,.xls,.csv" onchange="read(this.files[0],'v')"></label><button class="s" onclick="tpl('v')">⬇ Plantilla</button>
 <label class="b">👥 Personal<input type="file" accept=".xlsx,.xls,.csv" onchange="read(this.files[0],'p')"></label><button class="s" onclick="tpl('p')">⬇ Plantilla</button>
 <label class="b">📊 Cumplimiento punto<input type="file" accept=".xlsx,.xls,.csv" onchange="read(this.files[0],'c')"></label><button class="s" onclick="tpl('c')">⬇ Plantilla</button><label class="b">📋 Cumplimiento TAREA DIARIA<input type="file" accept=".xlsx,.xls,.csv" onchange="read(this.files[0],'t')"></label><button class="s" onclick="tpl('t')">⬇ Plantilla</button><label class="b">🎯 Tu tarea de hoy<input type="file" accept=".xlsx,.xls,.csv" onchange="read(this.files[0],'h')"></label><button class="s" onclick="tpl('h')">⬇ Plantilla</button>
 <button class="s" onclick="demo()">Ver ejemplo</button><button class="s" onclick="clearAll()">Borrar</button></div>
 <div class="row" style="margin-top:8px"><button onclick="pub()">🔑 Publicar accesos de asesores</button><button class="s" onclick="S.mode='asesor';render()">Ver como asesor</button></div>
 <p class="mu">${S.msg||`Puntos: ${S.puntos.length} · Personal: ${S.personal.length} · Cumplimiento punto: ${S.cumpl.length} · Tarea diaria: ${S.tarea.length} · Tarea de hoy: ${S.hoy.length}`}</p></div>`;
 if(S.punto&&pts[S.punto]){
  const P=pts[S.punto],D=(P.days||[]).map(d=>[d.f,d.i,d.m,d.r]);
  h+=`<button class="s" onclick="S.punto=null;render()">← Todos los puntos</button>
  <div class="card" style="margin-top:10px"><div class="row sp"><b>${esc(P.name)}</b>${pill(avg(P.items),P.items.length)}</div>${bar(avg(P.items))}
  <p class="mu">${[P.ciudad,P.resp&&'Resp.: '+P.resp].filter(Boolean).map(esc).join(' · ')}</p>
  ${P.items.length?`<div class="tw"><table><tr><th>Producto</th><th>Periodo</th><th>Meta</th><th>Real</th><th>%</th></tr>${P.items.map(i=>`<tr><td>${esc(i.ind)}</td><td>${esc(i.periodo)}</td><td>${i.meta.toLocaleString()}</td><td>${i.res.toLocaleString()}</td><td>${pill(i.pc,1)}</td></tr>`).join('')}</table></div>`:'<p class="mu">Sin cumplimiento cargado para este punto.</p>'}</div>
  <div class="card"><b>📅 Calendario del punto</b>${calHtml(D,'a','Chance')}</div>`;
 }else if(Object.keys(pts).length){
  h+=`<b>2. Puntos de venta</b>`;
  Object.values(pts).sort((a,b)=>avg(a.items)-avg(b.items)).forEach(P=>{
   h+=`<div class="card" onclick="S.punto='${esc(P.name).replace(/'/g,"\\'")}';S.q='';render()" style="cursor:pointer"><div class="row sp"><b>${esc(P.name)}</b>${pill(avg(P.items),P.items.length)}</div>${bar(avg(P.items))}<div class="mu">${P.ciudad?esc(P.ciudad)+' · ':''}${P.items.length} cumplimientos</div></div>`});
 }
 A.innerHTML=h;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function clearAll(){S.puntos=[];S.personal=[];S.cumpl=[];S.tarea=[];S.hoy=[];S.punto=null;S.msg='Datos de este dispositivo borrados. El historial guardado con Publicar accesos se conserva en la nube y se vuelve a cargar al abrir la app.';save();render()}

let DB=null,USR=null,ADV=null,tries=0;
const PRODS=['Chance','Lotería virtual','Lotería física','Baloto','Astro millonario','Kash','Raspa y gana','Recargas','Betplay'];
const mergeRows=(a,b,kf)=>{const m=new Map();a.forEach(r=>m.set(kf(r),r));b.forEach(r=>m.set(kf(r),r));return[...m.values()]};
const kC=r=>[norm(r.punto),r.fecha||r.periodo,r.ind].join('|');
const kT=r=>[r.id||norm(r.nombre),r.fecha||r.periodo,r.ind].join('|');
const kH=r=>[r.id||norm(r.nombre),r.fecha,norm(r.prod)].join('|');
const capD=(arr,n,i)=>{const s=new Set([...new Set(arr.map(x=>x[i]))].sort().slice(-n));return arr.filter(x=>s.has(x[i]))};
const nv=v=>String(v??'')===''?null:num(v);
const PRODT=['CH millonario','CH millonario 1 a 5','Tripletazo','Baloto','Miloto','Lotería virtual','Kash','Superchance','Raspa y listo'];
function parseC(rows,PL){PL=PL||PRODS;const out=[];
 rows.forEach(r=>{
  const punto=String(pick(r,['punto','sucursal','oficina'])).trim(),id=String(pick(r,['cedula','documento','id'])).trim(),nombre=String(pick(r,['nombre','asesor','empleado'])).trim(),fecha=toISO(pick(r,['fecha','dia'])),periodo=pick(r,['periodo','mes'])||fecha.slice(0,7);
  let found=false;
  PL.forEach(p=>{const np=norm(p);let m,x;
   for(const k of Object.keys(r)){const n=norm(k);if(n.startsWith(np)){const t=n.slice(np.length).trim();if(/^meta/.test(t))m=r[k];else if(/^(real|result|venta)/.test(t))x=r[k]}}
   if(m!==undefined||x!==undefined){found=true;if(String(m??'')!==''||String(x??'')!=='')out.push({id,nombre,punto,ind:p,meta:num(m),res:num(x),periodo,fecha})}});
  if(!found)out.push({id,nombre,punto,ind:String(pick(r,['indicador','producto','concepto'])).trim()||'General',meta:num(pick(r,['meta','presupuesto'])),res:num(pick(r,['resultado','real','ejecut','venta'])),periodo,fecha});
 });return out}
const CS={};
function toISO(v){if(v===''||v==null)return '';if(v instanceof Date)return v.toISOString().slice(0,10);
 if(typeof v=='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}
 const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
 const MS={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
 m=norm(s).match(/(\d{1,2})\D+?([a-z]{3})[a-z]*\D+?(\d{4})/);if(m&&MS[m[2]])return `${m[3]}-${String(MS[m[2]]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return ''}
function calNav(n,k){const s=CS[k]??={m:'',d:''};const[y,m]=s.m.split('-').map(Number),d=new Date(y,m-1+n,1);s.m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');s.d='';render()}
function calPick(d,k){const s=CS[k]??={m:'',d:''};s.d=s.d==d?'':d;render()}
function calHtml(D,k,focus){const s=CS[k]??={m:'',d:''};
 const ms=[...new Set(D.map(x=>x[0].slice(0,7)))].sort();if(!s.m)s.m=ms.length?ms[ms.length-1]:tod().slice(0,7);
 const by={};D.forEach(x=>{if(x[0].slice(0,7)!=s.m)return;const o=by[x[0]]??={};const a=o[x[1]]??=[0,0];a[0]+=x[2];a[1]+=x[3]});
 const dpc=f=>{const v=Object.values(by[f]||{}).filter(a=>a[0]>0).map(a=>a[1]/a[0]*100);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
 const[y,mo]=s.m.split('-').map(Number),n=new Date(y,mo,0).getDate(),first=(new Date(y,mo-1,1).getDay()+6)%7,fd=d=>s.m+'-'+String(d).padStart(2,'0');
 const ra={};if(focus){let sm=0,ct=0;for(let d=1;d<=n;d++){const c=(by[fd(d)]||{})[focus];if(c&&c[0]){sm+=c[1]/c[0]*100;ct++;ra[fd(d)]=sm/ct}}}
 let cells='';for(let i=0;i<first;i++)cells+='<i></i>';
 for(let d=1;d<=n;d++){const f=fd(d),p=focus?(ra[f]??null):dpc(f);cells+=`<button class="dc ${p==null?'':cls(p)}${s.d==f?' sel':''}" onclick="calPick('${f}','${k}')"><span>${d}</span><small>${p==null?'':p.toFixed(0)+'%'}</small></button>`}
 let rows='',sum=0,cnt=0;
 for(let d=1;d<=n;d++){const c=(focus?(by[fd(d)]||{})[focus]:null);if(!c||!c[0])continue;const p=c[1]/c[0]*100;sum+=p;cnt++;rows+=`<tr><td>${d}</td><td>${c[0].toLocaleString()}</td><td>${c[1].toLocaleString()}</td><td>${pill(p,1)}</td><td>${pill(sum/cnt,1)}</td></tr>`}

function hoyRows(){
 const iso=tod(),addD=f=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
 const done=(id,nom,prod,f)=>{const L=S.tarea.filter(t=>t.fecha==f&&norm(t.ind)==norm(prod)&&((id&&t.id==id)||(!id&&norm(t.nombre)==norm(nom))));return L.length?L.reduce((s,t)=>s+t.res,0):''};
 let base=[],f='';
 const hd=S.hoy.map(r=>r.fecha).filter(Boolean).sort();
 if(hd.length){f=hd[hd.length-1];const nd=f>=iso?addD(f):iso;base=S.hoy.filter(r=>r.fecha==f).map(r=>[r.id,r.nombre,nd,r.prod,r.valor,r.valor,done(r.id,r.nombre,r.prod,f)])}
 else{const td=S.tarea.map(t=>t.fecha).filter(Boolean).sort();
  if(td.length){f=td[td.length-1];const nd=f>=iso?addD(f):iso;base=S.tarea.filter(t=>t.fecha==f).map(t=>[t.id,t.nombre||'',nd,t.ind,t.meta,t.meta,t.res])}}
 const rows=base.map(r=>{const p=S.personal.find(x=>x.id&&x.id==r[0]);return[r[0],r[1]||(p?p.nombre:''),...r.slice(2)]}).map((r,i)=>({r,i,o:S.personal.findIndex(p=>(r[0]&&p.id==r[0])||(!r[0]&&norm(p.nombre)==norm(r[1])))})).sort((a,b)=>(a.o-b.o)||(a.i-b.i)).map(x=>x.r);
 return{rows,f}}
const addDay=f=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lastDay=a=>{const d=a.map(r=>r.fecha).filter(Boolean).sort();return d.length?d[d.length-1]:''};
const nextD=f=>{const i=tod();return(!f||f<i)?i:addDay(f)};
const wide=(L,PL)=>PL.flatMap(p=>{const x=L.filter(r=>norm(r.ind)==norm(p));return x.length?[x.reduce((s,r)=>s+r.meta,0),x.reduce((s,r)=>s+r.res,0)]:['','']});
function dyn(k){
 if(k=='h')return hoyRows().rows;
 if(k=='v')return S.puntos.map(v=>[v.name,v.ciudad||'',v.resp||'']);
 if(k=='p')return S.personal.map(p=>[p.id,p.nombre,p.cargo||'',p.punto,p.clave||(S.pins||{})[p.id]||'']);
 if(k=='c'){const f=lastDay(S.cumpl),nd=nextD(f),ns=S.puntos.map(p=>p.name);S.cumpl.forEach(r=>{if(r.punto&&!ns.some(n=>norm(n)==norm(r.punto)))ns.push(r.punto)});
  return ns.map(n=>[n,nd,...wide(S.cumpl.filter(r=>r.fecha==f&&norm(r.punto)==norm(n)),PRODS)])}
 if(k=='t'){const f=lastDay(S.tarea),nd=nextD(f);
  return S.personal.map(a=>[a.id,a.nombre,nd,...wide(S.tarea.filter(r=>r.fecha==f&&((a.id&&r.id==a.id)||(!r.id&&norm(r.nombre)==norm(a.nombre)))),PRODT)])}
 return []}

 c:['Cumplimientos',['Punto','Fecha',...PRODS.flatMap(p=>[p+' Meta',p+' Real'])],[['Nogales Centro','2026-10-21',...PRODS.flatMap((p,i)=>i<2?[100,i?80:112]:['',''])]]]}[k];
 let note='';const sv=(S.tpl||{})[k];
 if(sv&&sv.rows.length){T[1]=sv.hd;T[2]=sv.rows.map(r=>r.slice());
  const fi=sv.hd.findIndex(c=>norm(c)=='fecha');
  if(fi>=0){const ds=T[2].map(r=>toISO(r[fi])).filter(Boolean).sort();const nd=nextD(ds[ds.length-1]||'');T[2].forEach(r=>{r[fi]=nd})}
  note='Plantilla descargada tal como la cargaste la última vez. Cambia solo los valores.'}
 const ws=XLSX.utils.aoa_to_sheet([T[1],...T[2]]);ws['!cols']=T[1].map(()=>({wch:20}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,T[0]);if(k=='h')XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Productos válidos'],...PRODT.map(x=>[x])]),'Productos');
 try{const d=await claude.use('downloads');if(!d){S.msg='La descarga no está disponible aquí.';return render()}
  await d.save({filename:'Plantilla_'+T[0]+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});if(note){S.msg=note;render()}
 }catch(e){if(!e||e.code!='declined'){S.msg='No se pudo descargar la plantilla.';render()}}
}

function rs(file,max,sq,cb){const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');
  if(sq){const s=Math.min(im.width,im.height);c.width=c.height=max;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;x.drawImage(im,0,0,c.width,c.height)}
  URL.revokeObjectURL(u);cb(c.toDataURL(sq?'image/jpeg':'image/png',.8))};im.onerror=()=>cb(null);im.src=u}
function fotos(files){let n=0,t=files.length;[...files].forEach(f=>{const id=did(f.name.replace(/\.[^.]+$/,''));rs(f,160,true,d=>{if(d){S.fotos[id]=d;n++}if(--t==0){S.msg='Fotos cargadas: '+n+'. Toca Publicar accesos para que las vean los asesores.';save();render()}})})}
function logoUp(f){if(!f)return;rs(f,400,false,d=>{if(d){S.logo=d;save();S.msg='Logo actualizado. Toca Publicar accesos para que lo vean los asesores.';render()}})}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const did=c=>String(c).replace(/[^A-Za-z0-9_-]/g,'');
const isOwn=()=>!!(USR&&USR.isOwner());
async function loadDB(){
 if(!DB)return;
 try{
  const[a,pu,fo]=await Promise.all([DB.collection('asesores').get(),DB.collection('puntos').get(),DB.collection('fotos').get().catch(()=>({docs:[]}))]);
  fo.docs.forEach(d=>{const x=d.data();if(x.cedula&&x.foto)S.fotos[did(x.cedula)]=x.foto});
  const cum=[],tar=[],hoy=[],per=[],pts=[];
  a.docs.forEach(d=>{const x=d.data(),id=x.id||d.id;per.push({id,nombre:x.nombre,cargo:x.cargo,punto:x.punto,clave:'',ord:x.ord??1e9});S.pins=S.pins||{};if(x.pin)S.pins[id]=x.pin;
   if(x.foto&&!S.fotos[id])S.fotos[id]=x.foto;
   (x.tdias||[]).forEach(r=>tar.push({id,nombre:x.nombre,punto:'',ind:r[1],meta:r[2],res:r[3],periodo:r[0].slice(0,7),fecha:r[0]}));
   (x.hoy||[]).forEach(r=>hoy.push({id,nombre:x.nombre,fecha:r[0],prod:r[1],valor:r[2],ta:r[3],ra:r[4]}))});
  pu.docs.forEach(d=>{const x=d.data();pts.push({name:x.name,ciudad:x.ciudad,resp:x.resp,ord:x.ord??1e9});(x.dias||[]).forEach(r=>cum.push({id:'',nombre:'',punto:x.name,ind:r[1],meta:r[2],res:r[3],periodo:r[0].slice(0,7),fecha:r[0]}))});
  S.cumpl=mergeRows(cum,S.cumpl,kC);S.tarea=mergeRows(tar,S.tarea,kT);S.hoy=mergeRows(hoy,S.hoy,kH);
  if(!S.personal.length)S.personal=per.sort((a,b)=>a.ord-b.ord);if(!S.puntos.length)S.puntos=pts.filter(x=>x.name).sort((a,b)=>a.ord-b.ord);
  S.msg=a.docs.length||pu.docs.length?'Historial guardado cargado.':'';
 }catch(e){S.msg='No pude cargar el historial guardado.'}
}
async function pub(){
 if(!DB){S.msg='Para publicar accesos abre la app con tu cuenta de Claude.';return render()}
 const pts=build();let n=0,np=0;
 try{
  await DB.doc('config/app').set({logo:S.logo||''});
  let oi=0;
  for(const P of Object.values(pts)){
   if(!P.name||P.name=='Sin asignar')continue;
   await DB.doc('puntos/'+did(P.name)).set({ord:oi++,name:P.name,ciudad:String(P.ciudad||''),resp:String(P.resp||''),dias:capD((P.days||[]).map(d=>[d.f,d.i,d.m,d.r]),300,0)});np++}
  for(const p of S.personal){
   if(!p.id)continue;
   const key=Object.keys(pts).find(k=>norm(k)==norm(p.punto))||p.punto,P=pts[key];if(!P)continue;
   const agg={};P.items.forEach(i=>{const a=agg[i.ind]??={ind:i.ind,meta:0,res:0};a.meta+=i.meta;a.res+=i.res});
   const pin=/^\d{4}$/.test(p.clave)?p.clave:((S.pins||{})[p.id]||String(p.id).slice(-4)),ref=DB.doc('asesores/'+await sha(did(p.id)+':'+pin));
   const hm=new Map(),mn=t=>(t.id&&t.id==p.id)||(!t.id&&norm(t.nombre)==norm(p.nombre));
   S.hoy.filter(t=>!t.id&&!t.nombre).forEach(t=>hm.set(t.fecha+'|'+norm(t.prod),t));
   S.hoy.filter(t=>t.id||t.nombre).filter(mn).forEach(t=>hm.set(t.fecha+'|'+norm(t.prod),t));
   const A=P.ases[p.nombre]||{};
   await ref.set({pin:pin,ord:S.personal.indexOf(p),nombre:p.nombre,cargo:String(p.cargo||''),punto:P.name,ciudad:String(P.ciudad||''),resp:String(P.resp||''),id:did(p.id),foto:S.fotos[did(p.id)]||'',pp:avg(P.items),hoy:capD([...hm.values()].map(t=>[t.fecha,t.prod,t.valor,t.ta,t.ra]),90,0),tdias:capD((A.days||[]).map(d=>[d.f,d.i,d.m,d.r]),150,0),nA:Object.keys(P.ases).length,pt:Object.values(agg),mine:(A.items||[]).map(i=>({ind:i.ind,periodo:String(i.periodo||''),meta:i.meta,res:i.res}))});n++}
  S.msg='Historial guardado: '+n+' asesores y '+np+' puntos. Clave = columna "Clave" del archivo de personal; si no la pones, son los últimos 4 dígitos de la cédula.'
 }catch(e){S.msg='Error al publicar accesos: '+(e.message||e)}
 render();
}
async function login(){
 const ci=did(document.getElementById('ci').value.trim()),cl=document.getElementById('cl').value.trim();
 if(!DB){S.msg='No hay conexión con el servidor. Intenta de nuevo.';return render()}
 if(tries>=5){S.msg='Demasiados intentos. Intenta más tarde.';return render()}
 try{const key=await sha(ci+':'+cl),d=await DB.doc('asesores/'+key).get();
  if(d.exists){ADV=d.data();ADV.id=ci;ADV.key=key;tries=0;S.msg='';try{const pf=await DB.doc('fotos/'+key).get();if(pf.exists&&pf.data().cedula==ci&&pf.data().foto)ADV.foto=pf.data().foto}catch(e3){}try{const pd=await DB.doc('puntos/'+did(ADV.punto)).get();ADV.dias=pd.exists?(pd.data().dias||[]):(ADV.dias||[])}catch(e2){ADV.dias=[]}}
  else{tries++;S.msg='Cédula o clave incorrecta.'}}
 catch(e){S.msg='No se pudo consultar. Revisa la cédula e intenta de nuevo.'}
 render();
}

 rs(f,160,true,async d=>{if(!d){S.msg='No pude leer esa imagen.';return render()}
  ADV.foto=d;
  try{await DB.doc('fotos/'+ADV.key).set({cedula:ADV.id,foto:d});S.msg='Foto guardada.'}
  catch(e){S.msg='Tu foto se ve aquí, pero no se pudo guardar. Intenta de nuevo más tarde.'}
  render()})}
function warn(kind,rows){if(!rows.length)return ' ⚠ No encontré filas de datos. Revisa que los títulos estén en la primera fila.';
 if(kind=='h'){const ok=rows.filter(r=>toISO(pick(r,['fecha','dia']))&&String(pick(r,['producto','indicador'])).trim()).length;if(ok<rows.length)return ' ⚠ Solo '+ok+' filas tienen Fecha y Producto reconocidos. Revisa esas dos columnas.'}return ''}
function hoyNav(n){const c=new Date((HD||tod())+'T12:00:00');c.setDate(c.getDate()+n);const s=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');HD=s>=tod()?'':s;render()}
function hoyHtml(){const T=tod(),t=HD||T;
 const nav=`<div class="row sp"><button class="s" onclick="hoyNav(-1)">◀</button><b>${t==T?'Hoy · ':''}${esc(new Date(t+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}))}</b><button class="s" onclick="hoyNav(1)">▶</button></div>`;
 const L=(ADV.hoy||[]).filter(x=>x[0]==t);if(!L.length)return nav+`<p class="mu">${t==T?'No tienes tarea asignada para hoy.':'No hay tarea registrada para este día.'}</p>`;
 const ay=L.some(x=>x[3]!=null||x[4]!=null),f=v=>v==null?'—':v.toLocaleString();
 const pcs=L.filter(x=>x[3]>0&&x[4]!=null).map(x=>x[4]/x[3]*100),pa=pcs.length?pcs.reduce((s,x)=>s+x,0)/pcs.length:null;
 return nav+`<div class="tw"><table><tr><th>Producto</th><th>${t==T?'Hoy':'Tarea'}</th>${ay?'<th>Ayer: tarea</th><th>Real</th><th>%</th>':''}</tr>${L.map(([q,k,v,a,r])=>`<tr><td>${esc(k)}</td><td>${v.toLocaleString()}</td>${ay?`<td>${f(a)}</td><td>${f(r)}</td><td>${a>0&&r!=null?pill(r/a*100,1):'—'}</td>`:''}</tr>`).join('')}</table></div>${pa==null?'':`<div class="row sp" style="margin-top:8px"><b>Cumplimiento del día anterior</b>${pill(pa,1)}</div>`}`}
function renderAs(){
 const A=document.getElementById('app');
 const back=isOwn()&&location.hash=='#admin'?`<button class="s" onclick="ADV=null;S.mode='admin';render()">← Administrador</button>`:'';
 if(!ADV){A.innerHTML=`<div class="card"><b>Acceso de asesor</b><p class="mu">Ingresa tu cédula y tu clave de 4 dígitos.</p><input type="text" id="ci" inputmode="numeric" placeholder="Cédula"><input type="text" id="cl" inputmode="numeric" maxlength="4" placeholder="Clave (4 dígitos)" style="-webkit-text-security:disc"><div class="row"><button onclick="login()">Ingresar</button>${back}</div><p class="mu">${esc(S.msg)}</p></div>`;return}
 const m=ADV.mine.map(i=>({...i,pc:i.meta?i.res/i.meta*100:0})),pt=ADV.pt.map(i=>({...i,pc:i.meta?i.res/i.meta*100:0})),pa=avg(m);
 const dd=ADV.dias||[],ld=dd.length?dd.map(x=>x[0]).sort().pop():'';let ptd=pt,ppd=ADV.pp,lbl='';
 if(ld){const o={};dd.filter(x=>x[0]==ld).forEach(x=>{const a=o[x[1]]??={ind:x[1],meta:0,res:0};a.meta+=x[2];a.res+=x[3]});ptd=Object.values(o).map(i=>({...i,pc:i.meta?i.res/i.meta*100:0}));ppd=avg(ptd);lbl=new Date(ld+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
 const tb=(a)=>`<div class="tw"><table><tr><th>Indicador</th>${a[0]&&a[0].periodo!==undefined?'<th>Periodo</th>':''}<th>Meta</th><th>Real</th><th>%</th></tr>${a.map(i=>`<tr><td>${esc(i.ind)}</td>${i.periodo!==undefined?`<td>${esc(i.periodo)}</td>`:''}<td>${i.meta.toLocaleString()}</td><td>${i.res.toLocaleString()}</td><td>${pill(i.pc,1)}</td></tr>`).join('')}</table></div>`;
 A.innerHTML=`<div class="card"><div class="row sp" style="align-items:flex-start;flex-wrap:nowrap"><div><b style="font-size:17px">${esc(ADV.nombre)}</b><div class="mu">${esc(ADV.cargo)} · ${esc(ADV.punto)}</div>${S.msg?`<div class="mu" style="margin-top:6px">${esc(S.msg)}</div>`:''}<div style="margin-top:10px"><button class="s" onclick="ADV=null;render()">Salir</button></div></div><div style="text-align:center;flex:none">${ADV.foto?`<img class="av" style="width:96px;height:96px" src="${ADV.foto}" alt="Mi foto">`:`<div class="av" style="width:96px;height:96px;display:grid;place-items:center;font-size:40px">👤</div>`}<label class="b" style="display:block;margin-top:6px;padding:6px 8px;font-size:12px">📷 ${ADV.foto?'Cambiar':'Subir'} foto<input type="file" accept="image/*" onchange="myPhoto(this.files[0])"></label></div></div></div>
 <div class="card"><b>🎯 Tu tarea de hoy es</b>${hoyHtml()}</div>
 
 
 <div class="card"><div class="row sp"><b>Mi punto: ${esc(ADV.punto)}</b>${pill(ppd,ptd.length)}</div>${bar(ppd)}${lbl?`<p><b>📅 Cumplimiento del ${esc(lbl)}</b></p>`:''}<p class="mu">${[ADV.ciudad,ADV.resp&&'Resp.: '+ADV.resp].filter(Boolean).map(esc).join(' · ')}</p>${ptd.length?tb(ptd):''}<p><b>📅 Calendario de mi punto</b></p>${calHtml(ADV.dias||[],'c','Chance')}</div>`;
}
S.mode=null;render();
(async()=>{
 if(typeof claude=='undefined'){S.mode='admin';return render()}
 try{DB=await claude.use('db');USR=await claude.use('user')}catch(e){}
 if(DB&&!isOwn()){try{const c=await DB.doc('config/app').get();if(c.exists&&c.data().logo)S.logo=c.data().logo}catch(e){}}
 if(!isOwn()&&location.hash=='#admin'){adminForm();return}
 S.mode=(isOwn()&&location.hash=='#admin')?'admin':'asesor';render();
 if(S.mode=='admin'&&DB){S.msg='Cargando historial guardado…';render();await loadDB();save();render()}
})();
</script></body></html>
