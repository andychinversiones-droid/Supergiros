<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZONA NOGALES SUPERGIROS</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE (ver GUIA.md, paso 4) ===== */
const firebaseConfig={apiKey:"AIzaSyBJrL217D_-zLQnGWpc3J2uQOD-7hgvDNQ",authDomain:"supergiros-nogales.firebaseapp.com",projectId:"supergiros-nogales",appId:"1:181927712890:web:00370825cc2163925703c3"};
const ADMIN_EMAIL="andych.inversiones@gmail.com";
/* ================================================================== */
firebase.initializeApp(firebaseConfig);
const fdb=firebase.firestore(),fauth=firebase.auth();
const authReady=new Promise(r=>{const u=fauth.onAuthStateChanged(()=>{u();r()})});
window.claude={use:async n=>{
 if(n=='db')return{
  doc:p=>{const r=fdb.doc(p);return{get:async()=>{const s=await r.get();return{exists:s.exists,id:s.id,data:()=>s.exists?JSON.parse(s.data()._j):undefined}},set:async d=>{await r.set({_j:JSON.stringify(d)})}}},
  collection:c=>({get:async()=>{const s=await fdb.collection(c).get();return{docs:s.docs.map(d=>({id:d.id,data:()=>JSON.parse(d.data()._j)}))}}})};
 if(n=='user'){await authReady;return{isOwner:()=>!!(fauth.currentUser&&fauth.currentUser.email==ADMIN_EMAIL),id:async()=>fauth.currentUser?fauth.currentUser.uid:'anon'}}
 if(n=='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
}};
window.addEventListener('hashchange',()=>location.reload());
window.addEventListener('error',e=>{try{S.msg='⚠ Error en la página: '+e.message;render()}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{S.msg='⚠ Error: '+((e.reason&&e.reason.message)||e.reason);render()}catch(_){}});

const nf=n=>Number(n||0).toLocaleString('es-CO'),first1=n=>{const w=String(n||'').trim().split(/\s+/)[0]||'';return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()};
function waTasks(p,f){const pk=n=>norm(canonT(n)||n),m=new Map();S.hoy.filter(t=>t.fecha==f&&!t.id&&!t.nombre).forEach(t=>m.set(pk(t.prod),t));
 S.hoy.filter(t=>t.fecha==f&&(t.id||t.nombre)&&((t.id&&String(t.id)==String(p.id))||(!t.id&&norm(t.nombre)==norm(p.nombre)))).forEach(t=>m.set(pk(t.prod),t));return[...m.values()].filter(t=>t.valor>0)}
function waReal(p,f){const o={};S.tarea.filter(r=>r.fecha==f&&((r.id&&String(r.id)==String(p.id))||(!r.id&&norm(r.nombre)==norm(p.nombre)))).forEach(r=>{const k=norm(canonT(r.ind)||r.ind);o[k]=(o[k]||0)+(+r.res||0)});return o}
function waMsg(p){const t=(S.wa||{}).tipo,n=first1(p.nombre);
 if(t=='libre')return String((S.wa||{}).txt||'').replace(/\{nombre\}/gi,n);
 if(t=='todo'){const P=[],f0=tod(),R=rankAll()[String(p.id)],L0=waTasks(p,f0),free=String((S.wa||{}).txt||'').trim();
  if(L0.length)P.push('📋 *Tu tarea de hoy* ('+fmtD(f0)+'):\n'+L0.map(x=>'• '+(canonT(x.prod)||x.prod)+': '+nf(x.valor)).join('\n'));
  const ds=[...new Set(S.tarea.filter(r=>(r.id&&String(r.id)==String(p.id))||(!r.id&&norm(r.nombre)==norm(p.nombre))).map(r=>r.fecha))].sort(),f1=ds[ds.length-1];
  if(f1){const re=waReal(p,f1),L1=waTasks(p,f1);if(L1.length)P.push('📅 *Tu cumplimiento del '+fmtD(f1)+'*:\n'+L1.map(x=>{const r=re[norm(canonT(x.prod)||x.prod)]||0;return (r>=x.valor?'✅ ':'❌ ')+(canonT(x.prod)||x.prod)+': '+nf(r)+' de '+nf(x.valor)}).join('\n'))}
  if(R&&R.pos!=null)P.push('🏆 *Ranking*: vas en el puesto #'+R.pos+' de '+R.total+' (✅ '+R.ok+' · ❌ '+R.no+')');
  if(free)P.push('📢 '+free.replace(/\{nombre\}/gi,n));
  return P.length?'Hola '+n+' 👋 ZONA NOGALES\n\n'+P.join('\n\n')+'\n\n¡Vamos con toda! 💪':'Hola '+n+', todavía no hay información cargada para ti.'}
 if(t=='rank'){const R=rankAll()[String(p.id)];if(!R||R.pos==null)return 'Hola '+n+', aún no tienes resultados para el ranking de ZONA NOGALES. ¡Vamos con toda hoy! 💪';
  return 'Hola '+n+' 👋 En el ranking de ZONA NOGALES vas en el puesto #'+R.pos+' de '+R.total+'.\n✅ Tareas cumplidas: '+R.ok+'\n❌ Sin cumplir: '+R.no+'\n¡Vamos por más! 💪'}
 if(t=='tarea'){const f=tod(),L=waTasks(p,f);if(!L.length)return 'Hola '+n+', todavía no tienes tarea cargada para hoy.';
  return 'Hola '+n+' 👋 Tu tarea de hoy ('+fmtD(f)+'):\n'+L.map(x=>'• '+(canonT(x.prod)||x.prod)+': '+nf(x.valor)).join('\n')+'\n¡Éxitos! 💪'}
 if(t=='ayer'){const ds=[...new Set(S.tarea.filter(r=>(r.id&&String(r.id)==String(p.id))||(!r.id&&norm(r.nombre)==norm(p.nombre))).map(r=>r.fecha))].sort(),f=ds[ds.length-1];
  if(!f)return 'Hola '+n+', todavía no hay cumplimiento cargado para ti.';
  const re=waReal(p,f),L=waTasks(p,f);if(!L.length)return 'Hola '+n+', no hay tarea cargada del '+fmtD(f)+' para comparar.';
  return 'Hola '+n+' 👋 Tu cumplimiento del '+fmtD(f)+':\n'+L.map(x=>{const r=re[norm(canonT(x.prod)||x.prod)]||0;return (r>=x.valor?'✅ ':'❌ ')+(canonT(x.prod)||x.prod)+': '+nf(r)+' de '+nf(x.valor)}).join('\n')+'\n¡Sigamos así! 💪'}
 return ''}
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(d.length==10&&d[0]=='3')d='57'+d;return d.length>=11?d:''}
function waSend(i){const p=S.personal[i],num=waNum(p.tel);if(!num){S.msg='⚠ '+p.nombre+' no tiene un celular válido (10 dígitos, ej. 3001234567).';return render()}
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(waMsg(p)),'_blank')}
function waHtml(){const W=S.wa,T=[['todo','📨 Todo junto (tarea + cumplimiento + ranking + mensaje)'],['rank','🏆 Ranking'],['tarea','📋 Tarea de hoy'],['ayer','📅 Cumplimiento de ayer'],['libre','✏️ Mensaje libre']],
 ord=S.personal.map((p,i)=>({p,i})).filter(x=>x.p.id).sort((a,b)=>norm(a.p.nombre).localeCompare(norm(b.p.nombre)));
 return `<div class="card"><b>💬 Enviar por WhatsApp</b><p class="mu">Escoge el mensaje y toca Enviar en cada asesor: se abre WhatsApp con el texto listo y tú solo das enviar.</p>
 <select onchange="S.wa.tipo=this.value;render()">${T.map(t=>`<option value="${t[0]}"${W.tipo==t[0]?' selected':''}>${t[1]}</option>`).join('')}</select>
 ${W.tipo=='libre'||W.tipo=='todo'?`<p class="mu" style="margin:8px 0 0">${W.tipo=='todo'?'Mensaje libre (opcional, se agrega al final):':'Mensaje:'}</p><textarea rows="4" style="width:100%;margin-top:8px" oninput="S.wa.txt=this.value">${esc(W.txt||'')}</textarea><p class="mu">Escribe {nombre} para poner el nombre de cada asesor.</p>`:''}
 ${(()=>{const q=waQ(),i=W.qi||0;return `<div class="card" style="margin:10px 0"><b>▶ Cola de envío</b><p class="mu">Toca el botón: se abre el chat del siguiente asesor con su mensaje listo. Das enviar en WhatsApp, vuelves a la app y tocas de nuevo.</p><p class="mu">${q.length?(i>=q.length?'Listo, terminaste los '+q.length+'.':'Siguiente: <b>'+esc(q[i].p.nombre)+'</b> ('+(i+1)+' de '+q.length+')'):'Ningún asesor tiene celular válido.'}</p><div class="row"><button onclick="waNext()"${q.length?'':' disabled'}>${i==0?'Empezar':'Siguiente'}</button><button class="s" onclick="S.wa.qi=0;render()">Reiniciar</button></div></div>`})()}
 <div class="tw"><table><tr><th>Asesor</th><th>Celular</th><th></th></tr>${ord.map(x=>`<tr><td>${esc(x.p.nombre)}</td><td><input type="text" inputmode="numeric" placeholder="3001234567" value="${esc(x.p.tel||'')}" style="width:130px" oninput="S.personal[${x.i}].tel=this.value.replace(/\\D/g,'');save()"></td><td><button class="s" onclick="waSend(${x.i})">Enviar</button></td></tr>`).join('')}</table></div></div>`}
function avAdmin(){return `<div class="card"><b>📢 Aviso para todos los asesores</b><p class="mu">Escribe un mensaje y toca Publicar: todos los asesores lo ven al entrar con su cédula y clave.</p><textarea rows="4" style="width:100%" oninput="AVTXT=this.value">${esc(AVTXT)}</textarea><div class="row" style="margin-top:8px"><button onclick="avPub(false)">📢 Publicar aviso</button><button class="s" onclick="avPub(true)">Quitar aviso</button></div></div>`}

let AVISO=null,AVTXT='';
async function loadAviso(){try{if(!DB)return;const d=await DB.doc('config/aviso').get();AVISO=d.exists&&d.data().texto?d.data():null;render()}catch(e){}}
function avSeen(){try{return localStorage.getItem('avs')}catch(e){return null}}
function avHtml(){if(!AVISO||!AVISO.texto)return '';if(!isOwn()&&String(AVISO.t)==avSeen())return '';
 return `<div class="card" style="border:2px solid #d99100"><b>📢 Aviso</b><p style="white-space:pre-wrap;margin:8px 0">${esc(AVISO.texto)}</p>${isOwn()?'<p class="mu">Así lo ven los asesores.</p>':`<button class="s" onclick="try{localStorage.setItem('avs','${AVISO.t}')}catch(e){};AVISO=null;render()">Entendido</button>`}</div>`}
async function avPub(q){if(!DB||!isOwn()){S.msg='⚠ Entra como administrador para publicar el aviso.';return render()}
 const txt=q?'':String(AVTXT||'').trim();if(!q&&!txt){S.msg='Escribe el aviso primero.';return render()}
 try{await DB.doc('config/aviso').set({texto:txt,fecha:tod(),t:Date.now()});S.msg=q?'Aviso quitado: los asesores ya no lo ven.':'✅ Aviso publicado: los asesores lo ven al entrar.';if(q)AVTXT=''}catch(e){S.msg='⚠ No se pudo publicar el aviso: '+((e&&e.message)||e)}render()}
function waQ(){const o=S.personal.map((p,i)=>({p,i})).filter(x=>x.p.id&&waNum(x.p.tel)).sort((a,b)=>norm(a.p.nombre).localeCompare(norm(b.p.nombre)));return o}
function waNext(){const q=waQ(),i=S.wa.qi||0;if(i>=q.length){S.wa.qi=0;S.msg='Cola terminada: se enviaron los '+q.length+' mensajes.';return render()}
 const p=q[i].p;S.wa.qi=i+1;window.open('https://wa.me/'+waNum(p.tel)+'?text='+encodeURIComponent(waMsg(p)),'_blank');render()}

function rkDays(p){const ds=new Set();S.hoy.forEach(t=>{if(t.fecha&&((!t.id&&!t.nombre)||(t.id&&String(t.id)==String(p.id))||(!t.id&&norm(t.nombre)==norm(p.nombre))))ds.add(t.fecha)});
 S.tarea.forEach(r=>{if(r.fecha&&((r.id&&String(r.id)==String(p.id))||(!r.id&&norm(r.nombre)==norm(p.nombre))))ds.add(r.fecha)});return[...ds].sort().reverse()}
function rkDetail(id){const p=S.personal.find(x=>String(x.id)==String(id));if(!p)return '';const R=rankAll()[String(p.id)]||{},D=new Set(S.tarea.map(r=>r.fecha).filter(Boolean));
 const days=rkDays(p).map(f=>{const T=waTasks(p,f),re=waReal(p,f),seen=new Set(),rows=[];
  T.forEach(t=>{const k=norm(canonT(t.prod)||t.prod);seen.add(k);const r=re[k],has=D.has(f);rows.push({n:canonT(t.prod)||t.prod,t:t.valor,r:has?(r||0):null,ok:has?((r||0)>=t.valor):null})});
  Object.keys(re).forEach(k=>{if(!seen.has(k))rows.push({n:(PRODT.find(x=>norm(x)==k)||k),t:null,r:re[k],ok:null})});
  const ok=rows.filter(x=>x.ok===true).length,no=rows.filter(x=>x.ok===false).length;
  return `<div class="card" style="margin-top:8px"><div class="row sp"><b>${esc(fmtD(f))}</b><span>✅ ${ok} · ❌ ${no}</span></div><div class="tw"><table><tr><th>Producto</th><th>Tarea</th><th>Real</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.t==null?'—':nf(x.t)}</td><td>${x.r==null?'—':nf(x.r)}</td><td>${x.ok===true?'✅':x.ok===false?'❌':''}</td></tr>`).join('')}</table></div></div>`}).join('');
 return `<button class="s" onclick="S.rkSel=null;render()">← Volver al ranking</button><div class="card" style="margin-top:8px"><b>${esc(p.nombre)}</b><div class="mu">${esc(p.punto||'')}</div>${R.pos!=null?`<div class="row sp" style="margin-top:6px"><span>Puesto</span><b>#${R.pos} de ${R.total}</b></div>`:'<p class="mu">Aún sin resultados para el ranking.</p>'}<div class="row sp"><span>✅ Cumplidas</span><b>${R.ok||0}</b></div><div class="row sp"><span>❌ No cumplidas</span><b>${R.no||0}</b></div><div class="row sp"><span>🛒 Total vendido (desempate)</span><b>${nf(R.tot||0)}</b></div></div>${days||'<p class="mu">Este asesor aún no tiene días cargados.</p>'}`}
function rkAdmin(){if(S.rkSel!=null&&S.rkSel!==''&&S.rkSel!==false)return rkDetail(S.rkSel);
 const R=rankAll(),L=S.personal.filter(p=>p.id).map(p=>({p,r:R[String(p.id)]||{ok:0,no:0,pos:null}})).sort((a,b)=>(a.r.pos==null)-(b.r.pos==null)||(a.r.pos||0)-(b.r.pos||0)||norm(a.p.nombre).localeCompare(norm(b.p.nombre)));
 return `<div class="card"><b>🏆 Ranking de vendedores</b><p class="mu">Orden: más metas cumplidas; si hay empate, gana quien más haya vendido (suma de todo lo vendido en sus tareas). Toca un nombre para ver su cumplimiento día por día.</p>${L.length?`<div class="tw"><table><tr><th>#</th><th>Vendedor</th><th>✅</th><th>❌</th><th>Vendido</th></tr>${L.map(x=>`<tr style="cursor:pointer" onclick="S.rkSel='${esc(String(x.p.id)).replace(/'/g,'')}';render();window.scrollTo(0,0)"><td>${x.r.pos==null?'—':x.r.pos}</td><td><u>${esc(x.p.nombre)}</u><div class="mu" style="font-size:12px">${esc(x.p.punto||'')}</div></td><td>${x.r.ok||0}</td><td>${x.r.no||0}</td><td>${nf(x.r.tot||0)}</td></tr>`).join('')}</table></div>`:'<p class="mu">Primero sube el Personal.</p>'}</div>`}
function adminForm(){hdr();document.getElementById('app').innerHTML='<div class="card"><b>Acceso del administrador</b><input type="text" id="ae" placeholder="Correo"><input type="text" id="ap" placeholder="Contraseña" style="-webkit-text-security:disc"><button onclick="adminIn()">Entrar</button><p class="mu" id="am"></p></div>'}
function adminIn(){fauth.signInWithEmailAndPassword(document.getElementById('ae').value.trim(),document.getElementById('ap').value).then(()=>location.reload()).catch(()=>{document.getElementById('am').textContent='Correo o contraseña incorrectos.'})}
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14213d;--mu:#667085;--ac:#d62828;--bd:#e4e7ec;--ok:#1a9a53;--md:#d99100;--bad:#d62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192033;--tx:#eef1f7;--mu:#98a2b3;--bd:#2a3350;--ac:#ff5a5f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:16px;font-weight:800;letter-spacing:.5px;position:relative;overflow:hidden;min-height:92px;display:flex;align-items:flex-end}
header .wm{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain;mix-blend-mode:multiply;opacity:.5;pointer-events:none}
header>:not(.wm){position:relative}
header small{display:block;font-weight:400;opacity:.9}
main{max-width:760px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button,label.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;display:inline-block;font-size:14px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input[type=text],select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
input[type=file]{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-weight:700;border-radius:99px;padding:2px 10px;color:#fff;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.mu{color:var(--mu);font-size:13px}.sp{justify-content:space-between}
.ok{background:var(--ok)}.md{background:var(--md)}.bad{background:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.6)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotateY(360deg)}}@keyframes fl{50%{transform:translateY(-3px)}}
.lg img{background:#fff;border-radius:10px;padding:4px 10px}.lg{display:flex;align-items:center;gap:10px}.lg b span{display:inline-block;animation:pop .5s both}.coin{width:34px;height:34px;border-radius:50%;background:#ffd166;color:#d62828;display:grid;place-items:center;font-weight:900;animation:spin 3s linear infinite}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bd);flex:none}.avl{width:72px;height:72px}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal>i{display:block}.dh{font-size:11px;color:var(--mu)}
.dc{border:0;border-radius:8px;padding:6px 0;background:var(--bd);color:var(--mu);font-size:13px;display:flex;flex-direction:column;align-items:center;min-height:44px}.dc small{font-size:10px}

<header id="hd"></header>
<main id="app"></main>
<script>
let S={hoy:[],tarea:[],fotos:{},logo:'',puntos:[],personal:[],cumpl:[],punto:null,q:'',msg:''};
try{const x=localStorage.getItem('zns');if(x)Object.assign(S,JSON.parse(x),{punto:null,q:'',msg:''})}catch(e){}
S.cumpl=[];S.tarea=[];S.hoy=[];S.tpl={};
const save=()=>{try{localStorage.setItem('zns',JSON.stringify({prodmap:S.prodmap,pmap:S.pmap,fotos:S.fotos,logo:S.logo,puntos:S.puntos,personal:S.personal}))}catch(e){try{localStorage.setItem('zns',JSON.stringify({prodmap:S.prodmap,pmap:S.pmap,puntos:S.puntos,personal:S.personal,logo:S.logo}))}catch(e2){}}};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const pick=(r,keys)=>{for(const k of Object.keys(r)){const n=norm(k);if(keys.some(x=>n.includes(x)))return r[k]}return ''};
const num=v=>{const n=parseFloat(String(v).replace('%','').replace(',','.'));return isNaN(n)?0:n};
function read(file,kind){
 if(typeof XLSX=='undefined'){S.msg='⚠ No cargó el lector de Excel. Revisa tu internet y recarga la página.';return render()}
 if(!file){return}
 const fr=new FileReader();
 fr.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  let hi=aoa.findIndex(r=>r.filter(c=>/cedula|nombre|fecha|producto|punto|valor|ciudad|responsable|cargo|clave/.test(norm(c))).length>=2);if(hi<0)hi=0;
  const hd=(aoa[hi]||[]).map(c=>String(c).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};hd.forEach((k,i)=>{if(k)o[k]=r[i]??''});return o});
  if(kind=='v')S.puntos=rows.map(r=>({name:String(pick(r,['punto','nombre','sucursal','oficina'])).trim(),ciudad:pick(r,['ciudad','municipio','direccion']),resp:pick(r,['responsable','coordinador','encargado','lider'])})).filter(x=>x.name);else if(kind=='p')S.personal=rows.map(r=>({id:String(pick(r,['cedula','documento','id'])).trim(),nombre:String(pick(r,['nombre','asesor','empleado'])).trim(),cargo:pick(r,['cargo']),clave:String(pick(r,['clave','pin'])).trim(),tel:String(pick(r,['celular','telefono','whatsapp','movil'])).replace(/\D/g,''),punto:String(pick(r,['punto','sucursal','oficina'])).trim()||'Sin punto'}));
  else if(kind=='t')S.tarea=mergeLocked(S.tarea,parseC(rows,PRODT),kT);else if(kind=='h')S.hoy=mergeLocked(S.hoy,rows.map(r=>({id:String(pick(r,['cedula','documento','id'])).trim(),nombre:String(pick(r,['nombre','asesor','empleado'])).trim(),fecha:toISO(pick(r,['fecha','dia'])),prod:cT(String(pick(r,['producto','indicador'])).trim()),valor:num(pick(r,['valor','cantidad','meta'])),ta:nv(pick(r,['tarea de ayer','tarea ayer'])),ra:nv(pick(r,['real de ayer','real ayer']))})).filter(x=>x.prod&&x.fecha),kH);else S.cumpl=mergeLocked(S.cumpl,parseC(rows),kC);
  S.msg=(kind=='v'?'Puntos':kind=='p'?'Personal':kind=='t'?'Tarea diaria':kind=='h'?'Tarea de hoy':'Cumplimientos')+' cargado: '+rows.length+' filas'+warn(kind,rows)+(kind=='p'||kind=='v'?'':'');save();render();if(SAVE&&DB&&LOADED){const m0=S.msg;pub().then(()=>{S.msg=m0+' · '+S.msg;render()})}
 }catch(err){S.msg='No pude leer el archivo ('+((err&&err.message)||err)+'). Usa Excel (.xlsx) o CSV.';render()}};
 fr.readAsArrayBuffer(file);
}
function build(){
 const byId={},byName={};S.personal.forEach(p=>{if(p.id)byId[p.id]=p;byName[norm(p.nombre)]=p});

function hdr(){const h=document.getElementById('hd');
 const l=(S.logo||LOGO)?`<img src="${S.logo||LOGO}" alt="SUPERGIROS" style="height:46px;animation:fl 3s ease-in-out infinite">`:`<b style="font-size:22px;letter-spacing:1px">${[...'SUPERGIROS'].map((c,i)=>`<span style="animation-delay:${i*.07}s">${c}</span>`).join('')}</b>`;
 const wm=(S.logo||LOGO)?`<div class="wm" style="background-image:url('${S.logo||LOGO}')"></div>`:'';h.innerHTML=`${wm}${wm?'':`<div class="lg">${l}</div>`}<small>ZONA NOGALES · Cumplimientos por punto de venta · v61</small>`}
function rs(file,max,sq,cb){const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');
  if(sq){const s=Math.min(im.width,im.height);c.width=c.height=max;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;x.drawImage(im,0,0,c.width,c.height)}
  URL.revokeObjectURL(u);cb(c.toDataURL(sq?'image/jpeg':'image/png',.8))};im.onerror=()=>cb(null);im.src=u}
function fotos(files){let n=0,t=files.length;[...files].forEach(f=>{const id=did(f.name.replace(/\.[^.]+$/,''));rs(f,160,true,d=>{if(d){S.fotos[id]=d;n++}if(--t==0){S.msg='Fotos cargadas: '+n+'.';save();render();if(SAVE&&DB&&LOADED){const m0=S.msg;pub().then(()=>{S.msg=m0+' · '+S.msg;render()})}}})})}
function logoUp(f){if(!f)return;rs(f,400,false,d=>{if(d){S.logo=d;save();S.msg='Logo actualizado. Toca Publicar accesos para que lo vean los asesores.';render()}})}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const did=c=>String(c).replace(/[^A-Za-z0-9_-]/g,'');
const isAdH=()=>/^#admin/i.test(location.hash),isOwn=()=>!!(USR&&USR.isOwner());
async function loadDB(){
 if(!DB)return;
 try{
  const[a,pu,fo]=await Promise.all([DB.collection('asesores').get(),DB.collection('puntos').get(),DB.collection('fotos').get().catch(()=>({docs:[]}))]);
  fo.docs.forEach(d=>{const x=d.data();if(x.cedula&&x.foto)S.fotos[did(x.cedula)]=x.foto});
  const cum=[],tar=[],hoy=[],per=[],pts=[];
  a.docs.forEach(d=>{const x=d.data(),id=x.id||d.id;per.push({id,nombre:x.nombre,cargo:x.cargo,punto:x.punto,clave:'',ord:x.ord??1e9});S.pins=S.pins||{};if(x.pin)S.pins[id]=x.pin;
   if(x.foto&&!S.fotos[id])S.fotos[id]=x.foto;
   (x.tdias||[]).forEach(r=>tar.push({id,nombre:x.nombre,punto:'',ind:r[1],meta:r[2],res:r[3],cargado:r[5]||'',periodo:r[0].slice(0,7),fecha:r[0]}));
   (x.hoy||[]).forEach(r=>hoy.push({id,nombre:x.nombre,fecha:r[0],prod:r[1],valor:r[2],ta:r[3],ra:r[4],cargado:r[5]||''}))});
